name: PatchUp CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patchup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Linux Application Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CI: true
      PATCHUP_IMAGE_AI_ENABLED: "false"
      PATCHUP_AUTO_ACCEPT: "false"
      PATCHUP_CITY_ROADS_ENABLED: "false"
      PATCHUP_GEMINI_DATA_MODE: ""
      PATCHUP_GOOGLE_GEOCODING_ENABLED: "false"
      PATCHUP_GOOGLE_GEOCODING_PREVIEW_APPROVED: "false"
      PATCHUP_LOCATION_HISTORY_AUDITED: "false"
      PATCHUP_CITY_ROADS_REUSE_APPROVED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify runtime
        run: |
          node -v
          npm -v
          java -version

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify native image processing
        run: |
          node -e 'console.log(require("sharp").versions)'

      - name: TypeScript verification
        run: npm run lint

      - name: Firestore security rules lint
        run: npm run lint:rules

      - name: Application regression tests
        run: npm test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.37.0

      - name: Firestore emulator tests
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-patchup-verification \
            "npm run test:emulator"

      - name: Production build
        run: npm run build

      - name: Verify production assets
        run: |
          test -s dist/index.html
          test -s dist/fonts/coolvetica-rg.otf
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          echo "PASS: Production assets verified."

      - name: Dependency security audit
        run: npm audit --audit-level=low

      - name: Verify tracked files remain unchanged
        run: git diff --exit-code

  secrets:
    name: Credential Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Scan repository with Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            dir /repo --redact
