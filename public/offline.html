<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PatchUp — Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f7f8;
        color: #3a3535;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #e8dfc5;
        border-radius: 24px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(45, 43, 53, 0.08);
      }
      img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin: 0 auto 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.2;
        color: #2d2b35;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.5;
        color: #6e6978;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: #4cb729;
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 20px;
        min-height: 44px;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/patchup-logo.png" alt="PatchUp logo" />
      <h1>You are currently offline</h1>
      <p>
        PatchUp needs an active connection to load live Atlanta road reports, acquire map tiles, or
        upload pothole photos.
      </p>
      <button type="button" id="retry-btn">Try Again</button>
    </main>
    <script>
      (function () {
        var btn = document.getElementById('retry-btn');
        function refreshApp() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.update().catch(function () {});
                  })
                );
              })
              .finally(function () {
                window.location.reload();
              });
          } else {
            window.location.reload();
          }
        }
        if (btn) {
          btn.addEventListener('click', refreshApp);
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            window.location.reload();
          });
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.update().catch(function () {});
            });
          });
        }
      })();
    </script>
  </body>
</html>
